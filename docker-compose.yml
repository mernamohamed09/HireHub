services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: hirehub-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - hirehub-net

  # Redis In-Memory Cache & Rate Limiter Store
  redis:
    image: redis:7.2-alpine
    container_name: hirehub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hirehub-net

  # FastAPI AI ATS Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: hirehub-ai-service
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      - PORT=8008
      - AI_SERVICE_KEY=${AI_SERVICE_KEY:-dfghjuikop[kjhbgvc]}
    networks:
      - hirehub-net

  # Express.js REST API Backend
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hirehub-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_URL=mongodb://mongodb:27017/hirehub
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-replace-with-a-long-random-secret}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - AI_SERVICE_URL=http://ai-service:8008
      - AI_SERVICE_KEY=${AI_SERVICE_KEY:-dfghjuikop[kjhbgvc]}
    depends_on:
      - mongodb
      - redis
      - ai-service
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - hirehub-net

volumes:
  mongodb_data:
  redis_data:
  backend_uploads:

networks:
  hirehub-net:
    driver: bridge
